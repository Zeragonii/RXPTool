services:
  rxp-decrypt:
    build: .
    image: rxp-decrypt-web:1.0.0
    container_name: rxp-decrypt
    restart: unless-stopped
    ports:
      - "${RXP_BIND_IP:-0.0.0.0}:8787:8787"
    environment:
      RXP_USERNAME: ${RXP_USERNAME:-}
      RXP_PASSWORD: ${RXP_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
