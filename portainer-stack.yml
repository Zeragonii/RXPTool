# Portainer -> Stacks -> Add stack -> Web editor.
# No Dockerfile, registry credentials, build tools, or host files required
# when the GHCR package is PUBLIC.
# Set RXP_IMAGE, RXP_USERNAME and RXP_PASSWORD under Environment variables.
services:
  rxptool:
    image: ${RXP_IMAGE:-ghcr.io/zeragonii/rxptool:latest}
    container_name: rxptool
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      RXP_USERNAME: ${RXP_USERNAME:-}
      RXP_PASSWORD: ${RXP_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
