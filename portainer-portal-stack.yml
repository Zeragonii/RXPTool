# Add as a second Portainer stack; original RXPTool stack remains unchanged.
# Both services use the SAME ghcr.io/zeragonii/rxptool image.
services:
  rxptool-publisher:
    image: ${RXP_IMAGE:-ghcr.io/zeragonii/rxptool:edge}
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["uvicorn", "portal.entry:app", "--host", "0.0.0.0", "--port", "8787", "--no-access-log", "--workers", "1"]
    ports:
      - "${RXP_ADMIN_BIND_IP:-127.0.0.1}:8788:8787"
    environment:
      RXP_PORTAL_ROLE: admin
      RXP_PORTAL_ADMIN_USER: ${RXP_PORTAL_ADMIN_USER:?Set the private admin username}
      RXP_PORTAL_ADMIN_PASSWORD: ${RXP_PORTAL_ADMIN_PASSWORD:?Set a unique 20+ character password}
      RXP_PORTAL_DB: /data/portal.sqlite3
    volumes:
      - portal_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"]
      interval: 30s
      timeout: 7s
      retries: 3

  rxptool-download:
    image: ${RXP_IMAGE:-ghcr.io/zeragonii/rxptool:edge}
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["uvicorn", "portal.entry:app", "--host", "0.0.0.0", "--port", "8787", "--no-access-log", "--workers", "1", "--no-proxy-headers"]
    environment:
      RXP_PORTAL_ROLE: public
      RXP_PORTAL_DB: /data/portal.sqlite3
    depends_on:
      rxptool-publisher:
        condition: service_healthy
    volumes:
      - portal_data:/data:ro
    networks: [proxy]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"]
      interval: 30s
      timeout: 7s
      retries: 3

volumes:
  portal_data:
    name: rxptool_portal_data
networks:
  proxy:
    external: true
    name: ${RXP_PROXY_NETWORK:-rxptool-proxy}
